name: Manual Intraday Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_scanner.py
      - name: Commit tape
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Sector Tape Bot"
          git add scanner_data.csv sector_data.csv market_data.json
          git commit -m "Manual intraday tape [skip ci]" || echo "No changes"
          git push