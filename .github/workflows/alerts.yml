name: Market Close Telegram Alert

on:
  schedule:
    # Runs at exactly 3:20 PM IST (9:50 AM UTC) every Monday-Friday
    - cron: '50 9 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests pytz

      - name: Run Data Engine (Triggers Alert)
        run: python data_engine.py
