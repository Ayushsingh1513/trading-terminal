name: Live Data Engine Updater

on:
  schedule:
    # Runs every 15 mins during NSE market hours (Mon-Fri)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Allows manual testing

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz

      - name: Run Data Engine & Telegram Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python data_engine.py

      - name: Safely Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # This safely adds whatever files were created without crashing
          git add .
          
          git commit -m "Auto-update market data and telegram alerts [skip ci]" || echo "No changes to commit"
          git push
