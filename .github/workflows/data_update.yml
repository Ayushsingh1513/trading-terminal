name: Live Data Engine Updater

on:
  schedule:
    # Runs every 15 minutes between 9:00 AM and 4:00 PM IST (3:30 AM to 10:30 AM UTC) Mon-Fri
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Allows you to run it manually by clicking a button

permissions:
  contents: write # Crucial: Allows the bot to save the new CSVs back to GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests pytz

      - name: Run Data Engine
        run: python data_engine.py

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner_data.csv sector_data.csv market_data.json performance_history.json
          git commit -m "Auto-update market data [skip ci]" || echo "No changes to commit"
          git push
