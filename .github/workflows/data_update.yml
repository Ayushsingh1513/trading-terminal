name: Run Data Engine

on:
  schedule:
    # This runs automatically (e.g., every day at a specific time). You can keep your existing cron time here if you had one.
    - cron: '30 10 * * 1-5' 
  workflow_dispatch: # This adds the manual "Run workflow" button

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (Including AI NLP)
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz nltk

      - name: Run Data Engine
        run: python data_engine.py

      - name: Commit and Push Updated Ledger & Scans
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add performance_history.json scanner_data.csv sector_data.csv historical_scans.csv || true
          git commit -m "🤖 AI Engine Update: Pruned portfolio and analyzed news" || true
          git push