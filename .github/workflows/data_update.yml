name: Intraday Sector Scan

on:
  schedule:
    # Every 15 min, 09:30–15:15 IST (04:00–09:45 UTC), Mon–Fri
    - cron: "0,15,30,45 4-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-intraday-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_scanner.py

      - name: Commit tape
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Sector Tape Bot"
          git add scanner_data.csv sector_data.csv market_data.json last_alert.sha
          git commit -m "Intraday sector tape [skip ci]" || echo "No changes"
          git push