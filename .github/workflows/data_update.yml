name: ⚡ Live Data Engine Updater

on:
  schedule:
    # Runs every 15 minutes between 9:00 AM and 4:00 PM IST, Monday - Friday
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

# --- THIS IS THE MAGIC FIX FOR ERROR 128 ---
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: 🚀 Run Data Engine
        run: python data_engine.py

      - name: 💾 Commit and Push Live Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_data.json scanner_data.csv sector_data.csv
          git commit -m "Auto-update market data ⚡" || echo "No changes to commit"
          git push
