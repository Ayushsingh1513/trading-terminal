name: Live Data Engine Updater

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

# THIS FORCES GITHUB TO ALLOW FILE OVERWRITES
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz

      - name: Run Data Engine & Telegram Alerts
        run: |
          python data_engine.py

      - name: Safely Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update market data and telegram alerts [skip ci]" || echo "No changes to commit"
          
          # This prevents git conflicts before saving
          git pull --rebase origin main || echo "Nothing to pull"
          git push
