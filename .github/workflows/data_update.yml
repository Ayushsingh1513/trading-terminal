name: ⚡ Momentum AI Engine

on:
  schedule:
    # Runs at 10:30 AM UTC (which is 4:00 PM IST) every Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  run-market-scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' 

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests nltk pytz

      - name: 🧠 Execute Multi-Agent Engine
        env:
          # Passes the hidden secrets to Python securely
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python data_engine.py

      - name: 💾 Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Momentum Bot 🤖"
          git add scanner_data.csv sector_data.csv performance_history.json
          git commit -m "Auto-update: Post-Market Scan & Risk Ledger [skip ci]" || echo "No changes to commit"
          git push