name: ⚡ Momentum AI Engine

on:
  schedule:
    # Runs at 10:30 AM UTC (which is 4:00 PM IST) every Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows you to manually click a "Run Workflow" button for testing

permissions:
  contents: write # Critical: Allows the bot to save files back to your repo

jobs:
  run-market-scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up daily runs by caching installations

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs required libraries directly
          pip install yfinance pandas numpy requests nltk pytz
          # If you have a requirements.txt, you can uncomment the next line:
          # pip install -r requirements.txt

      - name: 🧠 Execute Multi-Agent Engine
        run: python data_engine.py

      - name: 💾 Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Momentum Bot 🤖"
          # Add the specific data files generated by your script
          git add scanner_data.csv sector_data.csv performance_history.json
          # The [skip ci] tag prevents this commit from accidentally triggering another action loop
          git commit -m "Auto-update: Post-Market Scan & Risk Ledger [skip ci]" || echo "No changes to commit"
          git push